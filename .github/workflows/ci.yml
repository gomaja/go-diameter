name: ci

# Every other check runs locally with `make check` (scripts/check.sh) before a
# change is merged. CI keeps only what cannot run there: the tests on macOS.

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'AUTHORS'
      - 'CONTRIBUTORS'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: test / macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go test
        run: go test ./... -short -count=1
