name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: diff check
        run: git diff --check

  test-linux:
    name: test-linux / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', stable]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Prepare SCTP support
        run: |
          sudo modprobe sctp
          test -e /proc/net/sctp/snmp
          sudo sysctl -w net.sctp.auth_enable=1 >/dev/null 2>&1 || true
          sudo sysctl -w net.sctp.intl_enable=1 >/dev/null 2>&1 || true
          for ip in 127.0.0.2 127.0.0.3 127.0.0.4; do
            sudo ip addr add "$ip/8" dev lo 2>/dev/null || true
          done
      - name: go test
        run: go test ./... -count=1 -timeout 900s
      - name: middleware module test
        working-directory: examples/middleware
        run: go test ./... -count=1 -timeout 900s

  test-linux-race:
    name: test-linux race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Prepare SCTP support
        run: |
          sudo modprobe sctp
          test -e /proc/net/sctp/snmp
          sudo sysctl -w net.sctp.auth_enable=1 >/dev/null 2>&1 || true
          sudo sysctl -w net.sctp.intl_enable=1 >/dev/null 2>&1 || true
          for ip in 127.0.0.2 127.0.0.3 127.0.0.4; do
            sudo ip addr add "$ip/8" dev lo 2>/dev/null || true
          done
      - name: go test -race
        run: go test ./... -race -count=1 -timeout 900s
      - name: middleware module race test
        working-directory: examples/middleware
        run: go test ./... -race -count=1 -timeout 900s

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go vet
        run: go vet ./...
      - name: middleware module vet
        working-directory: examples/middleware
        run: go vet ./...
      - name: cross vet
        run: |
          for target in linux/386 linux/arm linux/s390x linux/mips; do
            echo "== $target =="
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go vet ./...
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: latest
          install-go: false
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

  portability:
    name: portability / ${{ matrix.kind }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: unsupported-macos
            os: macos-latest
            command: go test ./... -short -count=1
          - kind: unsupported-windows
            os: windows-latest
            command: go test ./... -short -count=1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go test
        run: ${{ matrix.command }}

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: middleware module govulncheck
        working-directory: examples/middleware
        run: govulncheck ./...
