version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    groups:
      go-modules:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /oteldiam
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    groups:
      middleware-go-modules:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /dnsdiam
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    groups:
      discovery-go-modules:
        patterns:
          - '*'
    ignore:
      # Releases after v0.6.97 require Go 1.27. Hold the DNS client until
      # Go 1.26, the previous release this repository supports, leaves
      # support.
      - dependency-name: codeberg.org/miekg/dns
        versions: ['>= 0.6.98']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    groups:
      actions:
        patterns:
          - '*'
